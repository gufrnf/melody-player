<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody · 音乐播放器</title>
<style>
  :root{
    --bg0:#0b0d1a; --bg1:#151a30; --card:rgba(255,255,255,.06);
    --card2:rgba(255,255,255,.1); --line:rgba(255,255,255,.12);
    --txt:#f2f4ff; --sub:#a9b0d0; --accent:#7c8cff; --accent2:#c471ff;
    --c1:#7c8cff; --c2:#c471ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt);overflow:hidden;
    background:radial-gradient(1200px 700px at 15% -10%,#2b2f66 0%,transparent 55%),
               radial-gradient(900px 700px at 110% 20%,#5a2a6b 0%,transparent 50%),
               linear-gradient(135deg,var(--bg0),var(--bg1));
  }
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}
  .blob.a{width:360px;height:360px;background:#5b6bff;top:-80px;left:-60px;animation:float1 14s ease-in-out infinite}
  .blob.b{width:320px;height:320px;background:#c471ff;bottom:-100px;right:-40px;animation:float2 16s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,50px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-40px)}}

  .app{position:relative;z-index:1;height:100%;max-width:1080px;margin:0 auto;padding:26px 30px;display:flex;flex-direction:column;gap:20px}

  header{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;letter-spacing:.5px}
  .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(124,140,255,.4)}
  .logo svg{width:20px;height:20px;fill:#fff}
  .tag{font-size:12px;color:var(--sub);border:1px solid var(--line);padding:6px 12px;border-radius:20px}

  .main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:24px}

  /* 左：封面 + 信息 + 频谱 */
  .left{display:flex;flex-direction:column;gap:18px;min-height:0}
  .cover-wrap{flex:1;min-height:180px;display:grid;place-items:center;position:relative}
  .disc{width:min(280px,60%);aspect-ratio:1;border-radius:50%;position:relative;
    background:radial-gradient(circle at 50% 50%,#0b0d1a 0 18%,var(--c1) 19% 55%,var(--c2) 100%);
    box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 10px rgba(255,255,255,.04);
    display:grid;place-items:center;transition:background .6s}
  .disc::after{content:"";width:22%;aspect-ratio:1;border-radius:50%;background:#0b0d1a;
    box-shadow:0 0 0 6px rgba(255,255,255,.08),inset 0 0 10px rgba(0,0,0,.8)}
  .disc.spin{animation:spin 12s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note-mark{position:absolute;width:34%;fill:rgba(255,255,255,.85);filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));pointer-events:none}

  .meta{text-align:center}
  .meta h1{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta p{color:var(--sub);font-size:14px;margin-top:6px}
  .viz{width:100%;height:74px;display:block;opacity:.95}

  /* 右：播放列表 */
  .right{display:flex;flex-direction:column;min-height:0}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .list-head h2{font-size:15px;font-weight:600;color:var(--sub);letter-spacing:.5px}
  .import-btn{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--txt);
    background:linear-gradient(135deg,rgba(124,140,255,.35),rgba(196,113,255,.35));
    border:1px solid var(--line);padding:8px 14px;border-radius:12px;transition:.2s}
  .import-btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
  .import-btn svg{width:15px;height:15px;fill:currentColor}
  .playlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:6px}
  .playlist::-webkit-scrollbar{width:6px}
  .playlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px}
  .item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;
    border:1px solid transparent;transition:.18s}
  .item:hover{background:var(--card2)}
  .item.active{background:linear-gradient(135deg,rgba(124,140,255,.22),rgba(196,113,255,.18));border-color:var(--line)}
  .thumb{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--c1),var(--c2))}
  .thumb svg{width:20px;height:20px;fill:rgba(255,255,255,.9)}
  .item .info{flex:1;min-width:0}
  .item .info b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .info small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
  .item .dur{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .item .del{opacity:0;color:var(--sub);font-size:18px;line-height:1;padding:0 4px;transition:.15s}
  .item:hover .del{opacity:1}
  .item .del:hover{color:#ff7a90}
  .drop-hint{margin-top:12px;text-align:center;font-size:12px;color:var(--sub);
    border:1px dashed var(--line);border-radius:12px;padding:10px}
  .app.dragging .drop-hint{border-color:var(--accent);color:var(--accent);background:rgba(124,140,255,.1)}

  /* 底部控制条 */
  .controls{display:flex;flex-direction:column;gap:12px}
  .progress-row{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:18px}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
    background:linear-gradient(90deg,var(--accent) var(--p,0%),rgba(255,255,255,.15) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;margin-top:-4.5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.15)}
  input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
  #seek{flex:1}

  .btn-row{display:flex;align-items:center;justify-content:center;gap:18px;position:relative}
  .ctl{background:none;border:0;color:var(--sub);cursor:pointer;display:grid;place-items:center;transition:.18s;width:36px;height:36px}
  .ctl:hover{color:#fff;transform:scale(1.08)}
  .ctl svg{width:20px;height:20px;fill:currentColor}
  .ctl.on{color:var(--accent)}
  .play{width:54px;height:54px;border-radius:50%;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 26px rgba(124,140,255,.45)}
  .play:hover{color:#fff;transform:scale(1.06)}
  .play svg{width:24px;height:24px}
  .volume{display:flex;align-items:center;gap:8px;position:absolute;right:0}
  #vol{width:100px}
  .loading{font-size:12px;color:var(--accent);opacity:0;transition:.2s}
  .loading.show{opacity:1}

  @media(max-width:820px){
    .app{padding:16px}
    .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .disc{width:170px}
    .meta h1{font-size:20px}
    .volume{display:none}
  }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<div class="app" id="app">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
      <span>Melody</span>
    </div>
    <span class="tag">内置示例音乐 · 支持导入本地文件</span>
  </header>

  <div class="main">
    <section class="panel left">
      <div class="cover-wrap">
        <div class="disc" id="disc">
          <svg class="note-mark" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        </div>
      </div>
      <div class="meta">
        <h1 id="title">选择一首音乐</h1>
        <p id="artist">Melody · 让心情随旋律流动</p>
      </div>
      <canvas class="viz" id="viz"></canvas>
    </section>

    <section class="panel right">
      <div class="list-head">
        <h2>播放列表</h2>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="loading" id="loading">合成中…</span>
          <label class="import-btn">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
            导入音乐
            <input type="file" id="file" accept="audio/*" multiple hidden>
          </label>
        </div>
      </div>
      <div class="playlist" id="playlist"></div>
      <div class="drop-hint">把音频文件拖到这里即可加入播放列表</div>
    </section>
  </div>

  <div class="controls">
    <div class="progress-row">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="tot">0:00</span>
    </div>
    <div class="btn-row">
      <button class="ctl" id="shuffle" title="随机播放"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-3l-3 4 3 4h3v-3l4 4-4 4v-3h-4l-3-4-3 4H3v-2h3l3-4-3-4H3V8h4l3 4 3-4h4V3z"/></svg></button>
      <button class="ctl" id="prev" title="上一首"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg></button>
      <button class="ctl play" id="play" title="播放/暂停"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctl" id="next" title="下一首"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg></button>
      <button class="ctl" id="repeat" title="循环模式"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      <div class="volume">
        <button class="ctl" id="mute" title="静音"><svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12z"/></svg></button>
        <input type="range" id="vol" min="0" max="100" value="80">
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ---------- 内置示例音乐：Web Audio 程序化合成，无需外部音源 ---------- */
const PRESETS = [
  { name:"星夜微光", artist:"Melody 合成 · 舒缓", bpm:96, wave:"triangle",
    chords:["C","Am","F","G"], c1:"#7c8cff", c2:"#c471ff",
    melody:[[72,0,2],[76,2,2],[79,4,4],[76,8,2],[72,10,2],[74,12,4]] },
  { name:"霓虹脉冲", artist:"Melody 合成 · 律动", bpm:124, wave:"sawtooth",
    chords:["Dm","Bb","F","C"], c1:"#ff6a9c", c2:"#ffb347",
    melody:[[74,0,1],[77,1,1],[81,2,2],[77,4,1],[74,5,1],[72,6,2],[74,8,1],[77,9,1],[81,10,2],[84,12,4]] },
  { name:"晨雾", artist:"Melody 合成 · 静谧", bpm:80, wave:"sine",
    chords:["Gm","Eb","Bb","F"], c1:"#4fd0c0", c2:"#5b8cff",
    melody:[[65,0,4],[69,4,4],[72,8,4],[70,12,4]] }
];

const CHORD_NOTES = {
  C:[60,64,67], Am:[57,60,64], F:[53,57,60], G:[55,59,62],
  Dm:[62,65,69], Bb:[58,62,65], Gm:[55,58,62], Eb:[51,55,58]
};
const STEPS_PER_BAR = 8, BARS = 8, TOTAL_STEPS = STEPS_PER_BAR * BARS;
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

function scheduleNotes(ctx, notes, wave, peak, stepDur, dest){
  notes.forEach(([midi, start, len])=>{
    if(midi == null) return;
    const t0 = start * stepDur, dur = Math.max(len * stepDur, .12);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = wave; osc.frequency.value = midiFreq(midi);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + .02);
    g.gain.exponentialRampToValueAtTime(Math.max(peak*.45,.0002), t0 + dur*.55);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur - .01);
    osc.connect(g); g.connect(dest);
    osc.start(t0); osc.stop(t0 + dur + .02);
  });
}

async function renderPreset(p){
  const stepDur = 60 / p.bpm / 2;
  const duration = TOTAL_STEPS * stepDur + .6;
  const sr = 44100;
  const ctx = new OfflineAudioContext(2, Math.ceil(sr * duration), sr);
  const master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);

  // 伴奏：低音 + 琶音
  const bass = [], arp = [];
  for(let s = 0; s < TOTAL_STEPS; s++){
    const chord = CHORD_NOTES[p.chords[Math.floor(s / STEPS_PER_BAR) % p.chords.length]];
    if(s % STEPS_PER_BAR === 0) bass.push([chord[0] - 24, s, STEPS_PER_BAR - .3]);
    if(s % 2 === 0) arp.push([chord[(s/2) % 3] + 12, s, 1.4]);
  }
  scheduleNotes(ctx, bass, "sine", .16, stepDur, master);
  scheduleNotes(ctx, arp, "triangle", .07, stepDur, master);

  // 主旋律：4 小节动机重复 4 次
  const mel = [];
  for(let rep = 0; rep < 4; rep++)
    p.melody.forEach(([n, s, l]) => mel.push([n, rep * 16 + s, l]));
  scheduleNotes(ctx, mel, p.wave, .13, stepDur, master);

  const buf = await ctx.startRendering();
  return bufferToWav(buf);
}

function bufferToWav(buffer){
  const ch = buffer.numberOfChannels, sr = buffer.sampleRate, len = buffer.length;
  const bytes = 2, block = ch * bytes, dataSize = len * block;
  const ab = new ArrayBuffer(44 + dataSize), view = new DataView(ab);
  let pos = 0;
  const str = s => { for(let i=0;i<s.length;i++) view.setUint8(pos++, s.charCodeAt(i)); };
  str("RIFF"); view.setUint32(pos, 36 + dataSize, true); pos += 4;
  str("WAVE"); str("fmt "); view.setUint32(pos, 16, true); pos += 4;
  view.setUint16(pos, 1, true); pos += 2;
  view.setUint16(pos, ch, true); pos += 2;
  view.setUint32(pos, sr, true); pos += 4;
  view.setUint32(pos, sr * block, true); pos += 4;
  view.setUint16(pos, block, true); pos += 2;
  view.setUint16(pos, 16, true); pos += 2;
  str("data"); view.setUint32(pos, dataSize, true); pos += 4;
  const data = []; for(let c=0;c<ch;c++) data.push(buffer.getChannelData(c));
  for(let i=0;i<len;i++) for(let c=0;c<ch;c++){
    let s = Math.max(-1, Math.min(1, data[c][i]));
    view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true); pos += 2;
  }
  return URL.createObjectURL(new Blob([ab], {type:"audio/wav"}));
}

/* ---------- 播放器状态 ---------- */
const $ = id => document.getElementById(id);
const audio = $("audio"), disc = $("disc"), viz = $("viz");
let tracks = PRESETS.map((p, i) => ({
  id:"p"+i, name:p.name, artist:p.artist, preset:p, url:null, built:false, local:false, c1:p.c1, c2:p.c2
}));
let current = -1, repeatMode = 0, shuffleOn = false; // repeat: 0 列表 1 单曲 2 关闭
let audioCtx, analyser, sourceNode, dataArr, draggingSeek = false;

function ensureAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
  sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
  dataArr = new Uint8Array(analyser.frequencyBinCount);
}

/* ---------- 渲染列表 ---------- */
function fmt(t){
  if(!isFinite(t)) return "0:00";
  const m = Math.floor(t/60), s = Math.floor(t%60).toString().padStart(2,"0");
  return m+":"+s;
}
function renderList(){
  const el = $("playlist"); el.innerHTML = "";
  tracks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "item" + (i === current ? " active" : "");
    div.innerHTML = `
      <div class="thumb" style="--c1:${t.c1};--c2:${t.c2}">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
      <div class="info"><b>${escapeHtml(t.name)}</b><small>${escapeHtml(t.artist)}</small></div>
      <span class="dur">${t.local ? "" : "合成"}</span>
      ${t.local ? '<span class="del" title="移除">×</span>' : ''}`;
    div.onclick = e => { if(e.target.classList.contains("del")){ e.stopPropagation(); removeTrack(i); } else playAt(i); };
    el.appendChild(div);
  });
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function removeTrack(i){
  if(i === current){ audio.pause(); next(true); }
  tracks.splice(i, 1); renderList();
}

/* ---------- 播放控制 ---------- */
async function playAt(i){
  if(i < 0 || i >= tracks.length) return;
  current = i;
  const t = tracks[i];
  document.documentElement.style.setProperty("--c1", t.c1);
  document.documentElement.style.setProperty("--c2", t.c2);
  $("title").textContent = t.name;
  $("artist").textContent = t.artist;
  if(!t.url){
    $("loading").classList.add("show");
    try { t.url = await renderPreset(t.preset); t.built = true; }
    catch(err){ $("artist").textContent = "合成失败：" + err.message; $("loading").classList.remove("show"); return; }
    $("loading").classList.remove("show");
  }
  audio.src = t.url;
  ensureAudioGraph();
  if(audioCtx.state === "suspended") await audioCtx.resume();
  try { await audio.play(); } catch(e){}
  renderList();
}
function togglePlay(){
  if(current < 0){ playAt(0); return; }
  if(audio.paused) audio.play(); else audio.pause();
}
function next(auto){
  if(!tracks.length) return;
  let i = current;
  if(shuffleOn){ do { i = Math.floor(Math.random()*tracks.length); } while(i === current && tracks.length > 1); }
  else i = (current + 1) % tracks.length;
  if(auto && repeatMode === 2){ audio.pause(); audio.currentTime = 0; return; }
  playAt(i);
}
function prev(){
  if(!tracks.length) return;
  playAt((current - 1 + tracks.length) % tracks.length);
}

/* ---------- 事件绑定 ---------- */
$("play").onclick = togglePlay;
$("next").onclick = () => next(false);
$("prev").onclick = prev;
$("shuffle").onclick = e => { shuffleOn = !shuffleOn; e.currentTarget.classList.toggle("on", shuffleOn); };
$("repeat").onclick = e => {
  repeatMode = (repeatMode + 1) % 3;
  const b = e.currentTarget;
  b.classList.toggle("on", repeatMode !== 2);
  b.title = ["列表循环","单曲循环","不循环"][repeatMode];
};
$("mute").onclick = () => { audio.muted = !audio.muted; $("volIcon").style.opacity = audio.muted ? .4 : 1; };

$("seek").addEventListener("input", e => {
  draggingSeek = true;
  if(audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration;
});
$("seek").addEventListener("change", () => draggingSeek = false);
$("vol").addEventListener("input", e => {
  audio.volume = e.target.value / 100;
  e.target.style.setProperty("--p", e.target.value + "%");
});
audio.volume = .8; $("vol").style.setProperty("--p", "80%");

audio.addEventListener("timeupdate", () => {
  if(draggingSeek) return;
  const p = audio.duration ? audio.currentTime / audio.duration : 0;
  $("seek").value = Math.round(p * 1000);
  $("seek").style.setProperty("--p", (p*100) + "%");
  $("cur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => { $("tot").textContent = fmt(audio.duration); });
audio.addEventListener("ended", () => { if(repeatMode === 1){ audio.currentTime = 0; audio.play(); } else next(true); });
audio.addEventListener("play",  () => { $("playIcon").innerHTML = '<path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/>'; disc.classList.add("spin"); });
audio.addEventListener("pause", () => { $("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>'; disc.classList.remove("spin"); });

/* ---------- 导入本地音乐 ---------- */
function addFiles(files){
  [...files].forEach(f => {
    if(!f.type.startsWith("audio/") && !/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name)) return;
    const hue = Math.floor(Math.random()*360);
    tracks.push({
      id:"l"+Date.now()+Math.random(), name:f.name.replace(/\.[^.]+$/, ""),
      artist:"本地文件", url:URL.createObjectURL(f), local:true, built:true,
      c1:`hsl(${hue} 80% 62%)`, c2:`hsl(${(hue+60)%360} 80% 58%)`
    });
  });
  renderList();
  if(current < 0 && tracks.length) playAt(0);
}
$("file").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
["dragenter","dragover"].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); $("app").classList.add("dragging"); }));
["dragleave","drop"].forEach(ev => window.addEventListener(ev, e => {
  e.preventDefault();
  if(ev === "drop" || e.target === document.body) $("app").classList.remove("dragging");
}));
window.addEventListener("drop", e => { if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); togglePlay(); }
  else if(e.code === "ArrowRight" && audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
  else if(e.code === "ArrowLeft" && audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if(e.code === "ArrowUp"){ audio.volume = Math.min(1, audio.volume + .05); $("vol").value = audio.volume*100; $("vol").style.setProperty("--p",(audio.volume*100)+"%"); }
  else if(e.code === "ArrowDown"){ audio.volume = Math.max(0, audio.volume - .05); $("vol").value = audio.volume*100; $("vol").style.setProperty("--p",(audio.volume*100)+"%"); }
});

/* ---------- 频谱可视化 ---------- */
function drawViz(){
  requestAnimationFrame(drawViz);
  const w = viz.clientWidth, h = viz.clientHeight, dpr = window.devicePixelRatio || 1;
  if(viz.width !== w*dpr){ viz.width = w*dpr; viz.height = h*dpr; }
  const g = viz.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  let vals;
  if(analyser && !audio.paused){ analyser.getByteFrequencyData(dataArr); vals = dataArr; }
  else vals = new Uint8Array(64).fill(0);
  const bars = 48, bw = w / bars;
  for(let i=0;i<bars;i++){
    const v = vals[Math.floor(i / bars * vals.length)] / 255;
    const bh = Math.max(2, v * h * .92);
    const grad = g.createLinearGradient(0, h, 0, h - bh);
    grad.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue("--c1").trim() || "#7c8cff");
    grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue("--c2").trim() || "#c471ff");
    g.fillStyle = grad;
    g.beginPath(); g.roundRect(i*bw + 1, h - bh, bw - 2, bh, 3); g.fill();
  }
}

renderList();
drawViz();
</script>
